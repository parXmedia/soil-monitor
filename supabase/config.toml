project_id = "lafvin-wireless-soil-monitor"

# This function performs its own HMAC authentication for writes and a separate
# read-token check for reads. Supabase JWT verification is therefore disabled at
# the edge gateway, while database tables remain inaccessible to public roles.
[functions.soil-api]
verify_jwt = false

# Called by the scheduler, not by a signed-in user. It authenticates with the
# shared SOIL_CRON_SECRET in the Authorization header and refuses everything
# else, so the platform's JWT gate would only get in the way.
[functions.alert-monitor]
verify_jwt = false

