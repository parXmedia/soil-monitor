[platformio]
default_envs = display_receiver

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -Wextra
    -Wformat=2
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:display_receiver]
board = 4d_systems_esp32s3_gen4_r8n16
board_build.filesystem = littlefs
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=1
    -D DEVICE_ROLE_DISPLAY=1

[env:sensor_transmitter]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D DEVICE_ROLE_SENSOR=1
    -D SENSOR_PIN=9
    -D SENSOR_POWER_PIN=-1
    -D SENSOR_DEBUG=0
    ; Five minutes is the deployed cadence. Thirty seconds is a bench-test
    ; value: it drains the garden battery and fills the database ten times
    ; faster. The dashboard toggle can still request it at runtime.
    -D MEASUREMENT_INTERVAL_SECONDS=300
    ; Battery monitoring needs an external divider on the XIAO. Once fitted,
    ; set the pin here (for example -D BATTERY_SENSE_PIN=2) and adjust the
    ; ratio if the resistors are not equal.
    -D BATTERY_SENSE_PIN=-1
    -D BATTERY_DIVIDER_NUMERATOR=2
    -D BATTERY_DIVIDER_DENOMINATOR=1
