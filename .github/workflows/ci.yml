name: CI

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [display_receiver, sensor_transmitter]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # radio_secrets.h is deliberately git-ignored. CI compiles against
      # throwaway keys so a build break is caught without publishing real ones.
      - name: Generate CI-only secrets
        run: |
          sed 's/#define RADIO_SECRETS_CONFIGURED 0/#define RADIO_SECRETS_CONFIGURED 1/' \
            include/radio_secrets.example.h > include/radio_secrets.h
          test -f include/radio_secrets.h

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  backend:
    name: Edge function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Deno
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2
        with:
          deno-version: v2.x

      - name: Check formatting and lint
        working-directory: supabase
        run: |
          deno fmt --check
          deno lint

      - name: Type check edge function
        working-directory: supabase
        run: deno check functions/soil-api/index.ts functions/alert-monitor/index.ts

      - name: Run backend tests
        working-directory: supabase
        run: deno test --allow-none tests/soil_api_test.ts

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run dashboard tests
        run: python3 -m unittest discover -s dashboard/tests -v
